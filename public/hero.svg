<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="TabooTube — video streaming illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D21F3C"/>
      <stop offset="0.55" stop-color="#B3122E"/>
      <stop offset="1" stop-color="#8E0A20"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Soft decorative rings -->
  <circle cx="600" cy="300" r="260" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
  <circle cx="600" cy="300" r="330" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>
  <circle cx="600" cy="300" r="400" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1.5"/>

  <!-- Floating video cards (left / right) -->
  <g opacity="0.16">
    <rect x="120" y="150" width="170" height="110" rx="14" fill="#ffffff"/>
    <rect x="140" y="172" width="130" height="8" rx="4" fill="#8E0A20"/>
    <rect x="140" y="190" width="90" height="8" rx="4" fill="#8E0A20"/>
    <rect x="910" y="380" width="170" height="110" rx="14" fill="#ffffff"/>
    <rect x="930" y="402" width="130" height="8" rx="4" fill="#8E0A20"/>
    <rect x="930" y="420" width="90" height="8" rx="4" fill="#8E0A20"/>
  </g>
  <g opacity="0.10">
    <rect x="180" y="420" width="120" height="80" rx="12" fill="#ffffff"/>
    <rect x="900" y="140" width="120" height="80" rx="12" fill="#ffffff"/>
  </g>

  <!-- Central player card -->
  <rect x="380" y="130" width="440" height="300" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Play button -->
  <circle cx="600" cy="280" r="72" fill="#ffffff"/>
  <path d="M574 240 L574 320 L646 280 Z" fill="#B3122E"/>

  <!-- Player progress bar -->
  <rect x="410" y="392" width="380" height="8" rx="4" fill="#ffffff" opacity="0.35"/>
  <rect x="410" y="392" width="230" height="8" rx="4" fill="#ffffff"/>
  <circle cx="640" cy="396" r="10" fill="#ffffff"/>

  <!-- Bottom caption dots -->
  <circle cx="560" cy="520" r="7" fill="#ffffff" opacity="0.9"/>
  <circle cx="590" cy="520" r="7" fill="#ffffff" opacity="0.55"/>
  <circle cx="620" cy="520" r="7" fill="#ffffff" opacity="0.55"/>
  <circle cx="650" cy="520" r="7" fill="#ffffff" opacity="0.55"/>
</svg>
